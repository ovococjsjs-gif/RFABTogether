<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Пеликан на велосипеде</title>
  <desc>Векторная иллюстрация: белый пеликан в красном шарфе едет на бирюзовом велосипеде по дороге вдоль зелёных холмов</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e0fb"/>
      <stop offset="0.6" stop-color="#dcf3ff"/>
      <stop offset="1" stop-color="#fdf4e2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc7b8"/>
      <stop offset="1" stop-color="#a49a8c"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#ded7c9"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fbcb63"/>
      <stop offset="1" stop-color="#e08c1f"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f9b34a"/>
      <stop offset="1" stop-color="#d96b12"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3cb3a3"/>
      <stop offset="1" stop-color="#14665e"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#d8392b"/>
    </linearGradient>
    <linearGradient id="neckG" gradientUnits="userSpaceOnUse" x1="460" y1="170" x2="560" y2="300">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#ded7c9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.7" stop-color="#ffe37e"/>
      <stop offset="1" stop-color="#ffd34f"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d554a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5d554a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= ФОН ================= -->
  <rect x="0" y="0" width="960" height="640" fill="url(#sky)"/>
  <circle cx="884" cy="86" r="50" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="112" rx="64" ry="27"/>
    <ellipse cx="188" cy="98" rx="42" ry="22"/>
    <ellipse cx="98" cy="100" rx="34" ry="19"/>
    <ellipse cx="640" cy="70" rx="50" ry="21"/>
    <ellipse cx="680" cy="61" rx="32" ry="16"/>
  </g>
  <g fill="none" stroke="#7f93a8" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M330 150 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M378 130 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>

  <!-- холмы -->
  <path d="M0 404 C 130 330, 250 380, 372 400 C 512 422, 604 340, 764 380 C 856 402, 924 398, 960 406 L960 512 L0 512 Z" fill="#bad9a7"/>
  <path d="M0 444 C 150 404, 300 452, 470 442 C 640 432, 790 402, 960 438 L960 520 L0 520 Z" fill="#9dc98a"/>
  <g fill="#8bb87a" opacity="0.85">
    <circle cx="112" cy="476" r="15"/>
    <circle cx="140" cy="482" r="10"/>
    <circle cx="866" cy="464" r="17"/>
    <circle cx="894" cy="471" r="11"/>
  </g>

  <!-- дорога -->
  <rect x="0" y="500" width="960" height="140" fill="url(#road)"/>
  <g stroke="#f4efe4" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="586" x2="132" y2="586"/>
    <line x1="212" y1="586" x2="304" y2="586"/>
    <line x1="384" y1="586" x2="476" y2="586"/>
    <line x1="556" y1="586" x2="648" y2="586"/>
    <line x1="728" y1="586" x2="820" y2="586"/>
    <line x1="900" y1="586" x2="960" y2="586"/>
  </g>
  <ellipse cx="478" cy="548" rx="268" ry="18" fill="url(#shadow)"/>

  <!-- ================= ВЕЛОСИПЕД ================= -->
  <!-- колёса -->
  <g>
    <circle cx="300" cy="470" r="72" fill="none" stroke="#2b2b2b" stroke-width="11"/>
    <circle cx="300" cy="470" r="61" fill="none" stroke="#9b9b9b" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2" opacity="0.9">
      <line x1="300" y1="411" x2="300" y2="529"/>
      <line x1="241" y1="470" x2="359" y2="470"/>
      <line x1="258" y1="428" x2="342" y2="512"/>
      <line x1="342" y1="428" x2="258" y2="512"/>
    </g>
    <circle cx="300" cy="470" r="9" fill="#d8d8d8" stroke="#5a5a5a" stroke-width="3"/>
  </g>
  <g>
    <circle cx="650" cy="470" r="72" fill="none" stroke="#2b2b2b" stroke-width="11"/>
    <circle cx="650" cy="470" r="61" fill="none" stroke="#9b9b9b" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2" opacity="0.9">
      <line x1="650" y1="411" x2="650" y2="529"/>
      <line x1="591" y1="470" x2="709" y2="470"/>
      <line x1="608" y1="428" x2="692" y2="512"/>
      <line x1="692" y1="428" x2="608" y2="512"/>
    </g>
    <circle cx="650" cy="470" r="9" fill="#d8d8d8" stroke="#5a5a5a" stroke-width="3"/>
  </g>
  <!-- задний брызговик -->
  <path d="M228 442 A 80 80 0 0 1 350 410" fill="none" stroke="#2f9e8f" stroke-width="7" stroke-linecap="round"/>

  <!-- дальняя лапа (за рамой) -->
  <g stroke="#e69423" stroke-linecap="round" fill="none">
    <path d="M468 328 C 476 350, 484 376, 488 402" stroke-width="16"/>
    <path d="M488 398 C 489 410, 489 418, 489 426" stroke-width="11"/>
  </g>
  <g transform="translate(482 428) rotate(-8)">
    <path d="M-15 0 C -7 -9, 5 -11, 16 -9 C 27 -7, 37 -3, 39 2 C 35 9, 21 11, 8 10 C -4 9, -13 7, -15 4 Z" fill="#e69423" stroke="#c47a12" stroke-width="2"/>
    <path d="M7 10 L9 2 M21 10 L23 0" stroke="#c47a12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- рама -->
  <g fill="none" stroke="url(#frame)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 470 L462 470"/>
    <path d="M300 470 L402 344"/>
    <path d="M462 470 L402 344"/>
    <path d="M462 470 L528 352"/>
    <path d="M402 344 L528 352"/>
    <path d="M528 352 L650 470"/>
  </g>

  <!-- каретка, цепь, дальний шатун -->
  <g>
    <g fill="none" stroke="#6f6f6f" stroke-width="3" opacity="0.8">
      <path d="M300 461 L462 453"/>
      <path d="M300 479 L462 487"/>
    </g>
    <line x1="462" y1="470" x2="496" y2="437" stroke="#5c5c5c" stroke-width="7" stroke-linecap="round"/>
    <rect x="482" y="428" width="33" height="10" rx="5" fill="#2b2b2b" transform="rotate(12 498 433)"/>
    <circle cx="462" cy="470" r="19" fill="none" stroke="#4a4a4a" stroke-width="6"/>
    <circle cx="462" cy="470" r="7" fill="#4a4a4a"/>
  </g>

  <!-- ================= ПЕЛИКАН ================= -->
  <!-- хвост -->
  <path d="M372 292 C 340 288, 312 302, 302 322 C 326 326, 352 320, 372 308 Z" fill="#d7d0c1" stroke="#bdb4a3" stroke-width="2"/>
  <path d="M360 306 C 336 306, 318 314, 310 326 C 330 330, 350 322, 364 314 Z" fill="#e6e0d3" stroke="#c6b6a1" stroke-width="1.6" opacity="0.9"/>

  <!-- тело -->
  <ellipse cx="452" cy="266" rx="104" ry="78" fill="url(#body)" stroke="#cec5b5" stroke-width="3" transform="rotate(-9 452 266)"/>
  <path d="M470 322 C 430 336, 388 326, 366 302 C 392 330, 434 344, 470 322 Z" fill="#d9d1c1" opacity="0.45"/>

  <!-- шея -->
  <path d="M486 274 C 484 220, 508 176, 552 160" fill="none" stroke="#cec5b5" stroke-width="50" stroke-linecap="round"/>
  <path d="M486 274 C 484 220, 508 176, 552 160" fill="none" stroke="url(#neckG)" stroke-width="45" stroke-linecap="round"/>
  <path d="M512 268 C 510 224, 524 190, 552 176" fill="none" stroke="#e7e0d1" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M470 262 C 468 216, 490 176, 532 158" fill="none" stroke="#cec5b5" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- шарф: обмотка вокруг шеи, узел и развевающиеся концы -->
  <path d="M503 161 C 517 170, 530 184, 535 200 C 529 212, 523 219, 517 222 C 503 213, 489 202, 481 193 C 487 182, 494 171, 503 161 Z" fill="url(#scarf)" stroke="#c93023" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M494 170 C 505 180, 515 191, 521 201" fill="none" stroke="#ff9a8a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M486 200 C 496 207, 506 214, 516 220" fill="none" stroke="#a8271d" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path d="M487 178 C 462 164, 434 162, 408 174 C 420 186, 442 190, 461 183 C 473 179, 483 181, 490 187 Z" fill="#ee5a4a" stroke="#c93023" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M486 189 C 460 191, 434 205, 421 226 C 435 233, 455 225, 470 211 C 478 203, 484 199, 490 200 Z" fill="#c93023" stroke="#a8271d" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="490" cy="186" r="13" fill="#f4614f" stroke="#c93023" stroke-width="1.8"/>
  <path d="M484 180 C 487 176, 493 175, 497 178" fill="none" stroke="#ffb3a6" stroke-width="3" stroke-linecap="round"/>

  <!-- голова -->
  <circle cx="582" cy="152" r="38" fill="#fdfbf5" stroke="#cec5b5" stroke-width="3"/>
  <!-- хохолок -->
  <g fill="#f1ebdc" stroke="#cfc5b5" stroke-width="2.4" stroke-linejoin="round">
    <path d="M556 130 C 540 128, 526 122, 518 112 C 530 108, 546 112, 558 120 Z"/>
    <path d="M560 120 C 546 114, 536 104, 534 92 C 546 94, 558 104, 566 114 Z"/>
    <path d="M568 110 C 560 100, 558 88, 562 78 C 571 86, 576 98, 576 108 Z"/>
  </g>
  <!-- глаз -->
  <circle cx="596" cy="142" r="11" fill="#ffffff" stroke="#7a6a55" stroke-width="2"/>
  <circle cx="599" cy="143" r="5.6" fill="#2b2118"/>
  <circle cx="601" cy="140" r="1.9" fill="#ffffff"/>

  <!-- клюв: надклювье -->
  <path d="M604 140 C 660 132, 736 146, 792 166 C 798 169, 798 178, 790 181 C 732 178, 662 170, 606 162 Z" fill="url(#beak)" stroke="#c97a12" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M792 166 C 802 172, 803 184, 795 191 C 786 185, 782 177, 784 170 Z" fill="#c97a12"/>
  <!-- подклювье / мешок -->
  <path d="M606 162 C 648 188, 696 226, 748 204 C 780 190, 790 183, 790 181 C 734 178, 662 170, 606 162 Z" fill="url(#pouch)" stroke="#c96a10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M622 172 C 656 196, 698 220, 736 208" fill="none" stroke="#e08a24" stroke-width="2.5" opacity="0.7"/>
  <circle cx="648" cy="154" r="3" fill="#b8640c" opacity="0.65"/>
  <circle cx="692" cy="160" r="2.6" fill="#b8640c" opacity="0.65"/>

  <!-- сложенное крыло на боку -->
  <path d="M398 258 C 432 234, 486 238, 512 268 C 496 296, 460 314, 424 310 C 400 306, 388 282, 398 258 Z" fill="#fbf8f1" stroke="#cec5b5" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#d8d0c1" stroke-width="3" stroke-linecap="round">
    <path d="M408 268 C 436 250, 476 250, 500 268"/>
    <path d="M402 282 C 432 266, 470 266, 496 284"/>
    <path d="M414 296 C 438 284, 466 284, 486 296"/>
  </g>

  <!-- ближняя лапа: бедро и голень с коленом, лапа на педали -->
  <g stroke="#f0a02a" stroke-linecap="round" fill="none">
    <path d="M444 326 C 452 356, 458 380, 458 400" stroke-width="18"/>
    <path d="M458 396 C 448 426, 434 460, 427 486" stroke-width="12"/>
  </g>
  <circle cx="458" cy="399" r="10" fill="#f0a02a" stroke="#d1841c" stroke-width="1.5"/>
  <g transform="translate(421 489) rotate(-6)">
    <path d="M-16 0 C -8 -9, 4 -11, 16 -9 C 28 -7, 38 -3, 40 2 C 36 9, 22 12, 8 11 C -4 10, -14 7, -16 4 Z" fill="#f0a02a" stroke="#c97a12" stroke-width="2"/>
    <path d="M8 11 L10 2 M22 11 L24 0" stroke="#c97a12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- руль -->
  <g>
    <path d="M528 352 L534 320" stroke="#3b3b3b" stroke-width="10" stroke-linecap="round"/>
    <path d="M534 320 C 516 310, 494 310, 484 318" fill="none" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
    <path d="M534 320 C 550 308, 566 308, 576 316" fill="none" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="484" cy="318" r="6" fill="#1f1f1f"/>
    <circle cx="576" cy="316" r="6" fill="#1f1f1f"/>
    <circle cx="534" cy="320" r="6" fill="#3b3b3b"/>
    <!-- звонок -->
    <g>
      <path d="M542 306 C 542 296, 550 290, 558 292" fill="none" stroke="#3b3b3b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="556" cy="292" r="9" fill="#e8b23a" stroke="#b8860b" stroke-width="2"/>
      <circle cx="554" cy="290" r="3" fill="#f7dd94" opacity="0.9"/>
    </g>
  </g>

  <!-- ближний шатун и педаль -->
  <g>
    <line x1="462" y1="470" x2="428" y2="503" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
    <rect x="410" y="498" width="34" height="10" rx="5" fill="#2b2b2b" transform="rotate(15 427 503)"/>
  </g>

  <!-- передний брызговик -->
  <path d="M588 428 A 80 80 0 0 1 706 408" fill="none" stroke="#2f9e8f" stroke-width="7" stroke-linecap="round"/>

  <!-- движение -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M118 288 L192 288"/>
    <path d="M92 326 L168 326"/>
    <path d="M126 364 L178 364"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="216" cy="248" r="5"/>
    <circle cx="244" cy="392" r="4"/>
  </g>
  <!-- травинки на обочине -->
  <g stroke="#7fae6c" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M70 506 C 72 490, 78 480, 86 474"/>
    <path d="M78 506 C 84 492, 92 484, 102 480"/>
    <path d="M890 506 C 888 490, 882 480, 874 474"/>
    <path d="M882 506 C 876 492, 868 484, 858 480"/>
  </g>
</svg>
