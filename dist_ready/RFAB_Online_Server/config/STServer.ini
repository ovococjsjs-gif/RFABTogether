; ============================================================================
; RFAB Online - Server Configuration (Skyrim SE 1.5.97.0.8)
; ============================================================================
[GameServer]
uPort = 10578
uMaxPlayerCount = 8
bPremiumMode = true
sServerName = RFAB Online Co-Op Server
sPassword = 
sAdminPassword = 

[Gameplay]
; Difficulty: 0=Novice, 1=Apprentice, 2=Adept (RFAB/Requiem 1.0x standard!), 3=Expert, 4=Master, 5=Legendary
uDifficulty = 2
bEnableItemDrops = true
bEnableMiscQuestSync = true
bEnableGreetings = false
bEnablePvp = false
bSyncPlayerHomes = true
bEnableDeathSystem = true
uTimeScale = 20
bSyncPlayerCalendar = true
bAutoPartyJoin = true

; Enemy HP scaling (enemy spawn count never duplicates: strictly 1x spawns!)
; Formula when bAutoScaleEnemyHealth=true and N>=2 players:
;   Multiplier = fHealthMultiplier * (PlayerCount + fHealthExtraBase)
;   Default (1.0 & 1.0): 1 player = x1 HP | 2 players = x3 HP | 3 players = x4 HP
fHealthMultiplier = 1.000000
bAutoScaleEnemyHealth = true
fHealthExtraBase = 1.000000

; Which creatures get the multiplier above. Off (4.1.0): everything that is not on the players' side.
; On: creatures that never start a fight (townspeople, deer; permanent Aggression 0, under 800 HP, not a
; dragon) keep their normal health. Off until it has been through a playtest (docs/PLAYTEST.md).
bEnablePeacefulNpcsUnscaled = false

; 0 HP Downed-on-Knee bleedout + E-revive + strict combat leash + party wipe reload
bEnableDownedSystem = true

; Smart coordinated host saves/loads + automatic post-combat world checkpoints
bEnableCoordinatedSaves = true

; Catch-up XP: a player who was away is paid the shared RFAB XP the party earned meanwhile
; (up to 25000 per return). Counted per player name / Discord id, so a reconnect or a server
; restart pays nothing. Off until it has been through a playtest (docs/PLAYTEST.md).
bEnableLateJoinCatchUpXp = false

; Shared dragon souls: party members who were NOT near the dragon when it died get +1 soul.
; Players who are near absorb the soul the way the game always did (by walking up to the dragon),
; with or without this setting. Off until it has been through a playtest (docs/PLAYTEST.md).
bEnableSharedDragonSouls = false

; Mount ride guard: while a player rides a horse, other players cannot mount it, take over its
; simulation or change its saddlebag. Off = the behaviour of 4.1.0 (whoever mounts takes the horse).
; Off until it has been through a playtest (docs/PLAYTEST.md).
bEnableMountRideGuard = false

; Desync detector. Every client reports every five seconds what it believes about each character
; (is it there, who simulates it, alive or dead, health, a player's worn items); the server compares
; that with its own state and writes every difference that two reports in a row show to
; logs\STServerOut.log as "[RFAB Desync] ...". By itself it changes nothing in the game.
bEnableDesyncDetector = true
; On: a character that is missing on a client, left over on it, or alive there and dead on the
; server is also resent to that client (at most twice per character in two minutes). Off = the
; detector only writes to the log. Off until it has been through a playtest (docs/PLAYTEST.md).
bEnableDesyncAutoRepair = false

[ModPolicy]
bEnableModCheck = false
bAllowSKSE = true
bAllowMO2 = true
